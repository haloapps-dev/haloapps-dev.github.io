<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tailtick: free pet care reminders</title>
<link rel="canonical" href="https://play.google.com/store/apps/details?id=com.haloapps.tailtick">
<script>
  // The QR code on a Tailtick care sheet: iPhone and iPad go to the App
  // Store, everything else to Google Play, marked as coming from the sheet.
  var play = "https://play.google.com/store/apps/details?id=com.haloapps.tailtick&referrer=utm_source%3Dcare_sheet%26utm_medium%3Dprint%26utm_campaign%3Dsitter";
  var appStore = "https://apps.apple.com/app/id6831228756";
  var ua = navigator.userAgent || "";
  var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  location.replace(apple ? appStore : play);
</script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #1b1b1b; margin: 0; padding: 48px 16px; text-align: center; }
  a { display: inline-block; margin: 8px; padding: 12px 20px; border-radius: 999px; background: #4e55e0; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>

</body>
